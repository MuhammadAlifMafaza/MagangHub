<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
    <title id="title">Siklus laporan magang MagangHub</title>
    <desc id="description">Admin menyiapkan data, sistem membentuk periode, mahasiswa mengirim laporan, dan dosen memeriksa serta menerbitkan nilai. Dosen dapat meminta revisi.</desc>
    <defs>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
            <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1C3155" flood-opacity="0.06"/>
        </filter>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0 0L10 5L0 10Z" fill="#3B5C89"/>
        </marker>
        <marker id="return-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0 0L10 5L0 10Z" fill="#B45309"/>
        </marker>
    </defs>

    <rect width="1200" height="480" rx="20" fill="#F4F7FB"/>
    <rect x="1" y="1" width="1198" height="478" rx="19" stroke="#DFE7F0" stroke-width="2"/>

    <text x="48" y="42" fill="#3B5C89" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">MAGANGHUB  /  ALUR KERJA</text>
    <text x="48" y="78" fill="#1C3155" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="25" font-weight="700">Siklus laporan magang</text>
    <text x="48" y="103" fill="#556579" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="14">Periode mingguan, pemeriksaan dosen, revisi, hingga nilai diterbitkan</text>

    <line x1="280" y1="222" x2="315" y2="222" stroke="#3B5C89" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="575" y1="222" x2="610" y2="222" stroke="#3B5C89" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="870" y1="222" x2="905" y2="222" stroke="#3B5C89" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
        <rect x="35" y="140" width="245" height="164" rx="14" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.5"/>
        <rect x="35" y="140" width="245" height="4" rx="2" fill="#3B5C89"/>
        <circle cx="60" cy="169" r="13" fill="#EDF2F8"/>
        <text x="60" y="174" text-anchor="middle" fill="#1C3155" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13" font-weight="700">1</text>
        <rect x="82" y="156" width="74" height="25" rx="12.5" fill="#EDF2F8"/>
        <text x="119" y="173" text-anchor="middle" fill="#1C3155" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="11" font-weight="700">ADMIN</text>
        <text x="52" y="211" fill="#1F2E43" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="15" font-weight="700">Menyiapkan data</text>
        <text x="52" y="237" fill="#556579" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13">Akun, data magang, dan</text>
        <text x="52" y="257" fill="#556579" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13">penugasan dosen pembimbing</text>
    </g>

    <g filter="url(#shadow)">
        <rect x="330" y="140" width="245" height="164" rx="14" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.5"/>
        <rect x="330" y="140" width="245" height="4" rx="2" fill="#0369A1"/>
        <circle cx="355" cy="169" r="13" fill="#E0F2FE"/>
        <text x="355" y="174" text-anchor="middle" fill="#0369A1" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13" font-weight="700">2</text>
        <rect x="377" y="156" width="82" height="25" rx="12.5" fill="#E0F2FE"/>
        <text x="418" y="173" text-anchor="middle" fill="#0369A1" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="11" font-weight="700">SISTEM</text>
        <text x="347" y="211" fill="#1F2E43" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="15" font-weight="700">Membentuk periode</text>
        <text x="347" y="237" fill="#556579" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13">Periode laporan mingguan</text>
        <text x="347" y="257" fill="#556579" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13">dibuat dari tanggal magang</text>
    </g>

    <g filter="url(#shadow)">
        <rect x="625" y="140" width="245" height="164" rx="14" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.5"/>
        <rect x="625" y="140" width="245" height="4" rx="2" fill="#B45309"/>
        <circle cx="650" cy="169" r="13" fill="#FEF3C7"/>
        <text x="650" y="174" text-anchor="middle" fill="#92400E" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13" font-weight="700">3</text>
        <rect x="672" y="156" width="112" height="25" rx="12.5" fill="#FEF3C7"/>
        <text x="728" y="173" text-anchor="middle" fill="#92400E" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="11" font-weight="700">MAHASISWA</text>
        <text x="642" y="211" fill="#1F2E43" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="15" font-weight="700">Mengirim laporan</text>
        <text x="642" y="237" fill="#556579" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13">Unggah PDF atau DOCX;</text>
        <text x="642" y="257" fill="#556579" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13">baca umpan balik dan revisi</text>
    </g>

    <g filter="url(#shadow)">
        <rect x="920" y="140" width="245" height="164" rx="14" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.5"/>
        <rect x="920" y="140" width="245" height="4" rx="2" fill="#15803D"/>
        <circle cx="945" cy="169" r="13" fill="#DCFCE7"/>
        <text x="945" y="174" text-anchor="middle" fill="#166534" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13" font-weight="700">4</text>
        <rect x="967" y="156" width="67" height="25" rx="12.5" fill="#DCFCE7"/>
        <text x="1000" y="173" text-anchor="middle" fill="#166534" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="11" font-weight="700">DOSEN</text>
        <text x="937" y="211" fill="#1F2E43" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="15" font-weight="700">Memeriksa dan menilai</text>
        <text x="937" y="237" fill="#556579" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13">Setujui atau minta revisi;</text>
        <text x="937" y="257" fill="#556579" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13">terbitkan nilai setelah disetujui</text>
    </g>

    <path d="M1042 304V333H747V306" stroke="#B45309" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#return-arrow)"/>
    <rect x="803" y="320" width="130" height="24" rx="12" fill="#F4F7FB"/>
    <text x="868" y="336" text-anchor="middle" fill="#92400E" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="12" font-weight="600">Perlu revisi</text>

    <rect x="200" y="372" width="800" height="70" rx="14" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.5"/>
    <rect x="200" y="372" width="5" height="70" rx="2.5" fill="#3B5C89"/>
    <circle cx="232" cy="407" r="12" fill="#E0F2FE"/>
    <path d="M232 400V408M232 413V414" stroke="#0369A1" stroke-width="2" stroke-linecap="round"/>
    <text x="258" y="402" fill="#1C3155" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="14" font-weight="700">Status dan umpan balik tersimpan di MagangHub</text>
    <text x="258" y="423" fill="#556579" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13">Mahasiswa menerima notifikasi saat laporan diperiksa dan nilai diterbitkan.</text>
</svg>
